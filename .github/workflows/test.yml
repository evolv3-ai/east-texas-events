name: Regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash -n scripts/deploy-eventschedule-static.sh deploy/eventschedule/activate-static.sh
      - run: python -m unittest discover -s deploy/eventschedule -p test_smoke_static.py
      - name: Test actual Caddy routing
        run: bash deploy/eventschedule/test-proxy.sh
