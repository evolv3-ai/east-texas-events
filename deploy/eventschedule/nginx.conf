# Our copy of the upstream nginx config (eventschedule/dockerfiles 787c990). One difference:
# upstream overwrites X-Forwarded-Proto with nginx's own $scheme, which is always "http" here
# because TLS ends at the Caddy proxy in front. That line is gone, so the header Caddy sets
# reaches PHP unchanged and the app can tell an HTTPS request from an HTTP one.
server {
  listen 80 default_server;
  server_name _;
  root /var/www/html/public;
  index index.php index.html;
  client_max_body_size 500M;

  # Map legacy /register to the real /sign_up
  location = /register {
    return 308 /sign_up;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 300;
    fastcgi_pass app:9000;
  }

  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    access_log off;
    expires max;
  }
}
